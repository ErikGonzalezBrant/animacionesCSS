<html>
    <head>
        <title>Animacion por pasos</title>
        <style>
            *{
                margin:0px;
                padding: 0px;
            }

            body{
                background-image: url(./img/fondogif.gif);
                background-position: center;
                background-size: cover;
            }

            h2{
                color: white;
            }

            .contenedor{
                width: 800px;
                height: 300px;
                border: 10px solid black;
                background-color: white;
                margin: 0 auto;
                position: relative;   /* para los contenedores afuera va relative */
                overflow: hidden;
            }

            .cuadrito{
                width: 100px;
                height: 100px;
                top: 100px;
                left: -100px;
                position: absolute   /* para los que van dentro es absolute */;
                z-index: 2;

                animation-name: cuadrito;
                animation-duration: 6s;
                animation-iteration-count: infinite;
                animation-delay: 0.5s;
                /* animation-fill-mode: forwards; */
            }

            .cuadrito2{
                width: 100px;
                height: 100px;
                top: 100px;
                left: -100px;
                position: absolute   /* para los que van dentro es absolute */;
                z-index: 2;

                animation-name: cuadrito2;
                animation-duration: 6s;
                animation-iteration-count: infinite;
                animation-delay: 0.5s;
                /* animation-fill-mode: forwards; */
            }

            .texto{
                background-color: red;
            }
            a{color: aqua;}



            .fondo{
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0;
                left: 0;
                z-index: 0;
            }

            .nubes{
                width: 100%;
                height: 80%;
                position: absolute;
                top: 0;
                left: 0;
                z-index: 1;
            }

            .steve{
                width: 100%;
                height: 100%;
                z-index: 2;
                position: absolute;
            }

            .alex{
                width: 100%;
                height: 100%;
                z-index: 2;
                position: absolute;
            }
 
                @keyframes cuadrito {
                    0%{
                        top: 100px;
                        left: -100px;
                        rotate: 0deg;
                    }
                    33%{
                        top: 0px;
                        left: 350px;
                        rotate: 45deg;
                    }
                    66%{
                        top: 200px;
                        left: 350px;
                        rotate: 0deg;
                    }
                    100%{
                        top: 100px;
                        left: 800px;
                        rotate: 45deg;
                    }
                }

                @keyframes cuadrito2 {
                    0%{
                        top: 0px;
                        left: -100px;
                        rotate: 0deg;
                    }
                    33%{
                        top: 200px;
                        left: 350px;
                        rotate: 45deg;
                    }
                    66%{
                        top: 0px;
                        left: 350px;
                        rotate: 0deg;
                    }
                    100%{
                        top: 200px;
                        left: 800px;
                        rotate: 45deg;
                    }
                }

        </style>
    </head>
    <body>
        <div class="contenedor">
            <div class="cuadrito">
                <img src="./img/steve.png" class="steve">
            </div>
            <div class="cuadrito2">
                <img src="./img/alex.png" class="alex">
            </div>
            <img src="./img/nubes.png" class="nubes">
            <img src="./img/fondocraft.jpg" class="fondo">
        </div><br><br><br><br><br><br><br><br><br><br><br>
        <div class="texto"><h2>NOTA: LAS NUBES Y EL TERRENO SON IMÁGENES EN CAPAS DIFERENTES AUNQUE NO LO PAREZCA.</h2>
        <h2><a href="../index.html">Volver</a></h2></div>
       

    </body>
</html>
